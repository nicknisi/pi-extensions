name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm trusted publishing (OIDC)

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm trusted publishing: no NPM_TOKEN. Each package must have a
      # trusted publisher configured on npmjs.com pointing at this repo
      # and this workflow file (release.yml). OIDC + provenance are
      # handled by npm itself (requires npm CLI >= 11.5.1 in CI).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm run version`, not `pnpm version` — the latter is pnpm's builtin
          # version command (it requires a semver argument and never runs the
          # package.json script of the same name).
          version: pnpm run version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
