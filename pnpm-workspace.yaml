packages:
  - packages/*

allowBuilds:
  '@google/genai': true
  esbuild: true
  koffi: false
  protobufjs: true

# Transitive deps of the pi packages (typecheck-only here); their postinstalls aren't needed.
# esbuild (via vitest) ships its binary as a platform package; no postinstall needed.
ignoredBuiltDependencies:
  - '@google/genai'
  - esbuild
  - protobufjs
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.0'
  - '@earendil-works/pi-ai@0.84.0'
  - '@earendil-works/pi-client@0.84.0'
  - '@earendil-works/pi-coding-agent@0.84.0'
  - '@earendil-works/pi-protocol@0.84.0'
  - '@earendil-works/pi-telemetry@0.84.0'
  - '@earendil-works/pi-tui@0.84.0'
strictDepBuilds: false

# pi's runtime aliases @earendil-works/* to its own modules; we only need one
# canonical copy at the root for typechecking.
autoInstallPeers: false
