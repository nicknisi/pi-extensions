packages:
  - packages/*

allowBuilds:
  '@google/genai': true
  esbuild: true
  koffi: false
  protobufjs: true

# Transitive deps of the pi packages (typecheck-only here); their postinstalls aren't needed.
# esbuild (via vitest) ships its binary as a platform package; no postinstall needed.
ignoredBuiltDependencies:
  - '@google/genai'
  - esbuild
  - protobufjs
strictDepBuilds: false

# pi's runtime aliases @earendil-works/* to its own modules; we only need one
# canonical copy at the root for typechecking.
autoInstallPeers: false

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - vitest@5.1.1
  - '@earendil-works/pi-agent-core@1.6.0'
  - '@earendil-works/pi-ai@1.6.0'
  - '@earendil-works/pi-codemode@1.6.0'
  - '@earendil-works/pi-coding-agent@1.6.0'
  - '@earendil-works/pi-mcp@1.6.0'
  - '@earendil-works/pi-schema@1.6.0'
  - '@earendil-works/pi-telemetry@1.6.0'
  - '@earendil-works/pi-tui@1.6.0'
